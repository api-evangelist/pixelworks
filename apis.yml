name: Pixelworks
description: >-
  Pixelworks, Inc. (NASDAQ: PXLW) is a San Jose, California based semiconductor
  company founded in 1997 that designs video and pixel processing integrated
  circuits and software for digital video applications. Its technology spans
  digital displays, mobile devices, projection systems, digital signage, and
  video conferencing and surveillance, including the Iris visual processing
  line and TrueCut Motion cinematic-quality video platform. Pixelworks sells
  chips and IP to device makers rather than operating a public developer API
  platform; this profile is maintained in the API Evangelist network for
  company discovery and coverage tracking.
